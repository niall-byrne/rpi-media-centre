---

services:

  pihole:
    image: pihole/pihole:latest
    cap_add:
      - CHOWN
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
      - SYS_TIME
    container_name: pihole
    network_mode: host
    profiles:
      - pihole
    environment:
      - "FTLCONF_webserver_api_password=${RPI_PIHOLE_CREDENTIALS_PASSWORD}"
      - "FTLCONF_REPLY_ADDR4=${RPI_HOST_IP}"
      - "PIHOLE_GID=${RPI_SVC_GID}"
      - "PIHOLE_UID=${RPI_SVC_UID}"
      - "TZ=${RPI_HOST_TZ}"
    restart: "${RPI_RESTART_POLICY}"
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "${RPI_PIHOLE_PATH_CONFIG}:/etc/pihole"
      - "${RPI_PIHOLE_PATH_DNSMASQ}:/etc/dnsmasq.d"

  plex:
    image: niallbyrne/plex-server-docker-rpi:latest
    container_name: plex
    network_mode: host
    profiles:
      - plex
    environment:
      - "SET_PLEX_UID=${RPI_SVC_UID}"
      - "SET_PLEX_GID=${RPI_SVC_GID}"
    restart: "${RPI_RESTART_POLICY}"
    volumes:
      - "${RPI_PLEX_PATH_CONFIG}:/config"
      - "${RPI_PLEX_PATH_TRANSCODE}:/transcode"
      - "${RPI_PLEX_PATH_DATA_MOUNT_1}"
      - "${RPI_PLEX_PATH_DATA_MOUNT_2}"
      - "${RPI_PLEX_PATH_DATA_MOUNT_3}"
      - "${RPI_PLEX_PATH_DATA_MOUNT_4}"
      - "${RPI_PLEX_PATH_DATA_MOUNT_5}"
      - "${RPI_PLEX_PATH_DATA_MOUNT_6}"
      - "${RPI_PLEX_PATH_DATA_MOUNT_7}"
      - "${RPI_PLEX_PATH_DATA_MOUNT_8}"
      - "${RPI_PLEX_PATH_DATA_MOUNT_9}"

  samba:
    image: crazymax/samba:latest
    cap_add:
      - NET_ADMIN
      - NET_RAW
    container_name: samba
    network_mode: host
    profiles:
      - samba
    env_file:
      - path: /var/run/rpi/samba.env
        required: false
    environment:
      - "BROWSABLE=yes"
      - "SAMBA_HOSTS_ALLOW=${RPI_SAMBA_SUBNET:-192.168.0.0/24}"
      - "SAMBA_USERNAME=${RPI_SAMBA_CREDENTIALS_USERNAME:-nobody}"
      - "SAMBA_PASSWORD=${RPI_SAMBA_CREDENTIALS_PASSWORD:-none}"
      - "SAMBA_UID_RW=${RPI_SVC_UID}"
      - "SAMBA_UID_RO=${RPI_SVC_UID_RO}"
      - "SAMBA_GID_RO=${RPI_SVC_GID}"
      - "SAMBA_WORKGROUP=${RPI_SAMBA_WORKGROUP}"
      - "WSDD2_ENABLE=${RPI_SAMBA_SERVICE_DISCOVERY}"
      - "WSDD2_HOSTNAME=${RPI_SAMBA_HOSTNAME}"
      - "WSDD2_NETBIOS_NAME=${RPI_SAMBA_HOSTNAME}"
    restart: "${RPI_RESTART_POLICY}"
    volumes:
      - "${RPI_SAMBA_PATH_CONFIG}:/data"
      - "${RPI_SAMBA_PATH_DATA_MOUNT_1}"
      - "${RPI_SAMBA_PATH_DATA_MOUNT_2}"
      - "${RPI_SAMBA_PATH_DATA_MOUNT_3}"
      - "${RPI_SAMBA_PATH_DATA_MOUNT_4}"
      - "${RPI_SAMBA_PATH_DATA_MOUNT_5}"
      - "${RPI_SAMBA_PATH_DATA_MOUNT_6}"
      - "${RPI_SAMBA_PATH_DATA_MOUNT_7}"
      - "${RPI_SAMBA_PATH_DATA_MOUNT_8}"
      - "${RPI_SAMBA_PATH_DATA_MOUNT_9}"

  syncthing:
    image: syncthing/syncthing
    container_name: syncthing
    hostname: "${RPI_SYNCTHING_HOSTNAME:-syncthing}"
    environment:
      - "PUID=${RPI_SVC_UID}"
      - "PGID=${RPI_SVC_GID}"
      - "STHOMEDIR=/config"
    volumes:
      - "${RPI_SYNCTHING_PATH_CONFIG}:/config"
      - "${RPI_SYNCTHING_PATH_DATA_MOUNT_1}"
      - "${RPI_SYNCTHING_PATH_DATA_MOUNT_2}"
      - "${RPI_SYNCTHING_PATH_DATA_MOUNT_3}"
      - "${RPI_SYNCTHING_PATH_DATA_MOUNT_4}"
      - "${RPI_SYNCTHING_PATH_DATA_MOUNT_5}"
      - "${RPI_SYNCTHING_PATH_DATA_MOUNT_6}"
      - "${RPI_SYNCTHING_PATH_DATA_MOUNT_7}"
      - "${RPI_SYNCTHING_PATH_DATA_MOUNT_8}"
      - "${RPI_SYNCTHING_PATH_DATA_MOUNT_9}"
    ports:
      - 8384:8384 # Web UI
      - 22000:22000/tcp # TCP file transfers
      - 22000:22000/udp # QUIC file transfers
      - 21027:21027/udp # Receive local discovery broadcasts
    restart: "${RPI_RESTART_POLICY}"
    profiles:
      - syncthing
    healthcheck:
      test: curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
